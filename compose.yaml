services:
  sbor:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: 8000
      DATABASE_HOST: postgres
      POSTGRES_USER: kaban
      POSTGRES_DB: kaban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaban-local-db}
      REDIS_URL: redis://redis:6379/0
      VK_ID_APP_ID: ${VK_ID_APP_ID:-54905130}
      VK_ID_REDIRECT_URL: ${VK_ID_REDIRECT_URL:-https://games.kaban4ik.xyz/api/account/oauth/vk/callback}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URL: ${YANDEX_REDIRECT_URL:-https://games.kaban4ik.xyz/api/account/oauth/yandex/callback}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://games.kaban4ik.xyz}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - kaban-data:/data
    networks: [default, storage]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kaban
      POSTGRES_DB: kaban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaban-local-db}
    volumes:
      - kaban-postgres:/var/lib/postgresql/data
    networks: [storage]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U kaban -d kaban']
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [storage]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  kaban-data:
  kaban-postgres:

networks:
  storage:
    internal: true
